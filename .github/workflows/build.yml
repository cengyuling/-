name: Build Debug APK (中文汉化版)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压源码（若上传的是 zip 包）
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "发现源码包: $ZIP"
            unzip -o "$ZIP"
          fi
          if [ -f pubspec.yaml ]; then
            SRC="."
          else
            SRC=$(dirname "$(find . -name pubspec.yaml -not -path '*/build/*' | head -1)")
          fi
          echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"
          echo "源码目录: $SRC"

      - name: 安装 Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: ${{ env.SRC_DIR }}
        run: flutter pub get

      - name: 构建 Debug APK（调试签名，可直接安装）
        working-directory: ${{ env.SRC_DIR }}
        run: flutter build apk --debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: PerfMTK-Manager-zh-debug
          path: ${{ env.SRC_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
