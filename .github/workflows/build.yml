name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o *.zip
          ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android SDK Licenses
        run: flutter doctor --android-licenses --yes

      - name: Remove hardcoded javaHome in gradle.properties
        working-directory: ./PerfMTK-Manager/android
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Pub Get
        working-directory: ./PerfMTK-Manager
        run: flutter pub get

      - name: Build APK
        working-directory: ./PerfMTK-Manager
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfMTK-Manager-debug-apk
          path: ./PerfMTK-Manager/build/app/outputs/flutter-apk/app-debug.apk
