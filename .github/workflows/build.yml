name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o *.zip
          ls

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub Get
        working-directory: ./PerfMTK-Manager-zh
        run: flutter pub get

      - name: Build APK
        working-directory: ./PerfMTK-Manager-zh
        run: flutter build apk --debug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ./PerfMTK-Manager-zh/build/app/outputs/flutter-apk/app-debug.apk
