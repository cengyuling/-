name: Build Debug APK (中文汉化版)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压源码包
        run: |
          unzip -o *.zip
          ls -la

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 进入项目文件夹，安装依赖
        working-directory: ./PerfMTK-Manager-zh
        run: flutter pub get

      - name: 编译Debug APK
        working-directory: ./PerfMTK-Manager-zh
        run: flutter build apk --debug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfMTK-Manager-zh-apk
          path: ./PerfMTK-Manager-zh/build/app/outputs/flutter-apk/app-debug.apk
concurrency: 
