name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o *.zip
          ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Tell Flutter to use this JDK17
        working-directory: ./PerfMTK-Manager
        run: flutter config --jdk-dir $JAVA_HOME

      - name: Pub Get
        working-directory: ./PerfMTK-Manager
        run: flutter pub get

      - name: Build APK
        working-directory: ./PerfMTK-Manager
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfMTK-Manager-debug-apk
          path: ./PerfMTK-Manager/build/app/outputs/flutter-apk/app-debug.apk
