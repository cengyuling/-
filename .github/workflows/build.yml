name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o *.zip
          ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
